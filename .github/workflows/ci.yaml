name: CI Validation

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit hooks
        run: SKIP=no-commit-to-branch pre-commit run --all-files

  yaml-validation:
    name: YAML Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .

  ansible-validation:
    name: Ansible Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v25.12.0
        with:
          working_directory: ansible
          args: playbooks/ roles/

  markdown-validation:
    name: Markdown Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"

      - name: Check Markdown links
        uses: tcort/github-action-markdown-link-check@v1

  opentofu-validation:
    name: OpenTofu Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check OpenTofu formatting
        uses: dflook/tofu-fmt-check@v2
        with:
          path: .

      - name: Validate Proxmox configuration
        uses: dflook/tofu-validate@v2
        with:
          path: infrastructure/proxmox

      - name: Validate Kubernetes configuration
        uses: dflook/tofu-validate@v2
        with:
          path: kubernetes/opentofu

  security-validation:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
