---
# Kubernetes packages installation and repository configuration

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Kubernetes APT repository signing key
  ansible.builtin.get_url:
    url: "{{ kubernetes_apt_repository }}Release.key"
    dest: /etc/apt/keyrings/kubernetes-release.key
    owner: root
    group: root
    mode: "0644"

- name: Convert Kubernetes signing key to GPG keyring
  ansible.builtin.command:
    cmd: >-
      gpg
      --dearmor
      --output {{ kubernetes_apt_keyring }}
      /etc/apt/keyrings/kubernetes-release.key
    creates: "{{ kubernetes_apt_keyring }}"

- name: Configure Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ kubernetes_apt_keyring }}]
      {{ kubernetes_apt_repository }} /
    filename: kubernetes
    state: present
    update_cache: true

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ kubernetes_packages }}"
    state: present
    update_cache: true

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"