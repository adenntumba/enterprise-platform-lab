---
# Kubernetes CNI deployment tasks

- name: Check if Helm is installed
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_version_installed
  changed_when: false
  failed_when: false

- name: Install Helm
  when: >-
    helm_version_installed.rc != 0 or
    (helm_version_installed.stdout | trim).split('+')[0] != 'v' ~ helm_version
  block:
    - name: Download Helm installation script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
        dest: /tmp/get_helm.sh
        mode: "0755"

    - name: Execute Helm installation script
      ansible.builtin.command:
        cmd: "/tmp/get_helm.sh --version v{{ helm_version }}"
      become: true
      changed_when: true

    - name: Remove Helm installation script
      ansible.builtin.file:
        path: /tmp/get_helm.sh
        state: absent

- name: Verify Helm installation
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_version_final
  changed_when: false

- name: Assert expected Helm version
  ansible.builtin.assert:
    that:
      - (helm_version_final.stdout | trim).split('+')[0] == 'v' ~ helm_version
    fail_msg: >-
      Expected Helm v{{ helm_version }}, but found
      {{ helm_version_final.stdout | default('unknown') }}.

- name: Check if Cilium Helm release exists
  ansible.builtin.command:
    cmd: >-
      helm list
      --namespace {{ cilium_namespace }}
      --kubeconfig {{ cilium_kubeconfig }}
      --filter '^{{ cilium_release_name }}$'
      --output json
  register: cilium_release_status
  changed_when: false
  failed_when: false

- name: Read Cilium Helm release values
  ansible.builtin.command:
    cmd: >-
      helm get values {{ cilium_release_name }}
      --namespace {{ cilium_namespace }}
      --kubeconfig {{ cilium_kubeconfig }}
      --output json
  register: cilium_release_values
  changed_when: false
  failed_when: false
  when: >-
    cilium_release_status.rc == 0 and
    (cilium_release_status.stdout | from_json | length) > 0

- name: Determine Cilium release state
  ansible.builtin.set_fact:
    cilium_release_exists: >-
      {{
        cilium_release_status.rc == 0 and
        (cilium_release_status.stdout | from_json | length) > 0
      }}
    cilium_current_values: >-
      {{
        cilium_release_values.stdout | from_json
        if (
          cilium_release_status.rc == 0 and
          (cilium_release_status.stdout | from_json | length) > 0
        )
        else {}
      }}
    cilium_current_chart: >-
      {{
        (cilium_release_status.stdout | from_json)[0].chart
        if (
          cilium_release_status.rc == 0 and
          (cilium_release_status.stdout | from_json | length) > 0
        )
        else ''
      }}

- name: Install or upgrade Cilium CNI
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install {{ cilium_release_name }}
      {{ cilium_chart }}
      --version {{ cilium_version }}
      --namespace {{ cilium_namespace }}
      --kubeconfig {{ cilium_kubeconfig }}
      --set operator.hostNetwork={{ cilium_operator_host_network | lower }}
      --set-string operator.extraArgs[0]=--operator-api-serve-addr={{ cilium_operator_api_serve_addr }}
      --wait
  when: >-
    not cilium_release_exists
    or cilium_current_chart != 'cilium-' ~ cilium_version
    or cilium_current_values.get('operator', {}).get('hostNetwork', true)
       != cilium_operator_host_network
    or cilium_current_values.get('operator', {}).get('extraArgs', [])
       != ['--operator-api-serve-addr=' ~ cilium_operator_api_serve_addr]
  register: cilium_install
  changed_when: true