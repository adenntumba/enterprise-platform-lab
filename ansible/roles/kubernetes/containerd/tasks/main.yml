---
# containerd installation and configuration tasks

- name: Install containerd
  ansible.builtin.apt:
    name: "{{ containerd_package }}"
    state: present
    update_cache: true

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if containerd configuration exists
  ansible.builtin.stat:
    path: "{{ containerd_config_file }}"
  register: containerd_config

- name: Generate default containerd configuration
  ansible.builtin.shell:
    cmd: "containerd config default > {{ containerd_config_file }}"
  when: not containerd_config.stat.exists
  changed_when: true

- name: Configure containerd cgroup driver
  ansible.builtin.replace:
    path: "{{ containerd_config_file }}"
    regexp: '^(\s*SystemdCgroup\s*=\s*)(true|false)$'
    replace: '\1{{ containerd_systemd_cgroup | lower }}'
  notify: Restart containerd

- name: Configure containerd CNI binary directory
  ansible.builtin.replace:
    path: "{{ containerd_config_file }}"
    regexp: '^(\s*bin_dir\s*=\s*")[^"]+(")$'
    replace: '\1{{ containerd_cni_bin_dir }}\2'
  notify: Restart containerd

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: "{{ containerd_service }}"
    enabled: true
    state: started