---
# Kubernetes node baseline defaults

kubernetes_required_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - conntrack
  - socat
  - ipset
  - ethtool
  - util-linux

kubernetes_kernel_modules:
  - overlay
  - br_netfilter

kubernetes_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1

kubernetes_sysctl_config_file: /etc/sysctl.d/99-kubernetes.conf

kubernetes_time_sync_package: chrony
kubernetes_time_sync_service: chrony
