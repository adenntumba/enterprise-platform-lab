---
- name: Install Unbound
  ansible.builtin.apt:
    name: "{{ unbound_package_name }}"
    state: present
    update_cache: true
  become: true

- name: Ensure Unbound configuration directory exists
  ansible.builtin.file:
    path: /etc/unbound
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy Unbound configuration
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf.d/enterprise-platform.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Unbound
  become: true

- name: Validate Unbound configuration
  ansible.builtin.command:
    cmd: unbound-checkconf /etc/unbound/unbound.conf
  changed_when: false
  become: true

- name: Ensure Unbound service is enabled
  ansible.builtin.systemd:
    name: "{{ unbound_service_name }}"
    enabled: "{{ unbound_service_enabled }}"
    state: "{{ unbound_service_state }}"
  become: true
  when: not ansible_check_mode