---
# =============================================================================
# Pi-hole Role Defaults
# =============================================================================
#
# Edge DNS Platform
#
# Architecture:
#
#   LAN
#     |
#     v
#   Pi-hole :53
#     |
#     v
#   Unbound 192.168.0.110:5335
#
# =============================================================================

# -----------------------------------------------------------------------------
# Installation
# -----------------------------------------------------------------------------

pihole_repository_url: "https://github.com/pi-hole/pi-hole.git"

pihole_repository_version: "master"

pihole_installer_dir: "/opt/pihole-installer"

pihole_installer_path: "{{ pihole_installer_dir }}/automated install/basic-install.sh"

pihole_installer_unattended_flag: "--unattended"

# -----------------------------------------------------------------------------
# Pi-hole installation detection
# -----------------------------------------------------------------------------

pihole_binary_path: "/usr/local/bin/pihole"

pihole_config_dir: "/etc/pihole"

pihole_config_path: "{{ pihole_config_dir }}/pihole.toml"

# -----------------------------------------------------------------------------
# Network
# -----------------------------------------------------------------------------

pihole_interface: "eth0"

pihole_ipv4_address: "192.168.0.111"

pihole_ipv4_cidr: "192.168.0.111/24"

pihole_ipv4_network: "192.168.0.0/24"

pihole_gateway: "192.168.0.1"

# -----------------------------------------------------------------------------
# DNS
# -----------------------------------------------------------------------------

pihole_dns_port: 53

pihole_upstream_dns:
  - "192.168.0.110#5335"

pihole_dns_listening_mode: "LOCAL"

pihole_dns_interface: "{{ pihole_interface }}"

# -----------------------------------------------------------------------------
# IPv6
# -----------------------------------------------------------------------------

pihole_ipv6_enabled: false

# -----------------------------------------------------------------------------
# DHCP
# -----------------------------------------------------------------------------

pihole_dhcp_enabled: false

# -----------------------------------------------------------------------------
# DNS behavior
# -----------------------------------------------------------------------------

pihole_query_logging: true

pihole_dnssec: true

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------

pihole_service_name: "pihole-FTL"

pihole_service_enabled: true

pihole_service_state: "started"

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------

pihole_required_packages:
  - ca-certificates
  - curl
  - git
  - dialog
  - dnsutils
  - iproute2
  - jq