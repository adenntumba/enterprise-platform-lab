---
# tasks file for linux
- name: Update apt cache

  ansible.builtin.apt:

    update_cache: "{{ update_cache }}"

    cache_valid_time: 3600


- name: Upgrade installed packages

  ansible.builtin.apt:

    upgrade: dist

  when: upgrade_packages


- name: Install common packages

  ansible.builtin.apt:

    name: "{{ linux_packages }}"

    state: present